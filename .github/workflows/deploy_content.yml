name: Deploy Web App & Content

on:
  push:
    branches: ["main"]
  # Erlaubt manuelles Starten des Workflows
  workflow_dispatch:

# WICHTIG: Berechtigungen für den GITHUB_TOKEN setzen
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass mehrere Deploys gleichzeitig laufen
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. Bauen (Audio generieren & Ordner vorbereiten)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      # --- Caching für den Audio-Ordner ---
      - name: Cache Audio Files
        uses: actions/cache@v4
        with:
          path: assets/audio
          key: audio-cache-${{ github.run_id }}
          restore-keys: |
            audio-cache-
      # ------------------------------------

      - name: Generate Audio Files
        run: node scripts/generateAudio.js
        continue-on-error: true

      - name: Build Web App & Assets
        run: npm run build

      # Artefakt hochladen (dist enthält Web App, PWA, Audio & Content)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2. Deployen (Veröffentlichen)
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4